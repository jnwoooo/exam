              --title "ncn ${GITHUB_REF_NAME#ncn-v}" --notes "ncn 배포 묶음(서명 없음). 설치: zip 압축 풀기 → install.cmd. 안내: codeagent_pvgpt/newcontinue/배포_가이드.md"   # 새 릴리스
          fi
