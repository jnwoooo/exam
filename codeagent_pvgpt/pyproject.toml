# codeagent_pvgpt — Continue(IntelliJ) 기반 코딩 에이전트 2판: 코드에이전트 서버 + RAG 서비스
[project]
name = "codeagent-pvgpt"                 # 패키지 이름
version = "0.1.0"                           # 버전
requires-python = ">=3.12"                  # torch(sentence-transformers) 호환을 위해 3.12 이상, 개발은 3.13
dependencies = [
    "fastapi>=0.115",                       # 두 서버(RAG·코드에이전트)의 HTTP 프레임워크
    "uvicorn[standard]>=0.30",              # FastAPI 실행기
    "httpx>=0.27",                          # 서버 → 외부 LLM·RAG 호출(비동기 스트리밍 지원)
    "mcp>=2.3,<3",                          # MCP 파이썬 SDK 2.x(MCPServer)
    "qdrant-client>=1.12",                  # Qdrant 서버 접속
    "sentence-transformers>=3.0",           # KoE5 임베딩(로컬 실행)
    "psycopg[binary]>=3.2",                 # PostgreSQL 드라이버(권한·토큰·사용량)
    "psycopg-pool>=3.2",                    # Postgres 연결 풀
    "redis>=5.0",                           # 사용량 한도 카운터·권한 캐시
]

[dependency-groups]
dev = ["pytest>=8"]                         # 테스트

[tool.pytest.ini_options]
testpaths = ["tests"]                       # 테스트 폴더
pythonpath = ["."]                          # 루트를 import 경로에(agent_server 등)
